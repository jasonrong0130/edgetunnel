name: One-shot ProxyIP V2 stable ID migration

on:
  push:
    paths:
      - '.github/workflows/proxyip-v2-stable-id.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stable ProxyIP node identity
        run: python3 .github/scripts/proxyip_v2_patch.py

      - name: Validate Worker
        run: |
          node --check _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir /tmp/wrangler-dry
          git diff --check

      - name: Commit V2 worker and cleanup one-shot files
        run: |
          rm -f .github/workflows/proxyip-v2-stable-id.yml .github/scripts/proxyip_v2_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js .github/workflows/proxyip-v2-stable-id.yml .github/scripts/proxyip_v2_patch.py
          git commit -m 'fix: migrate ProxyIP bindings to stable node ids'
          git push origin HEAD:main
