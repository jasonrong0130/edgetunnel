name: Fix ProxyIP verify UI

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-verify-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(' 检测响应超时');
			if (!value) break;
			if (value.byteLength === 0) continue;
			const merged = new Uint8Array(responseBuffer.length + value.byteLength);
			merged.set(responseBuffer, 0);
			merged.set(value, responseBuffer.length);
			responseBuffer = merged;
			const partial = decoder.decode(responseBuffer);
			if (/(?:^|\n)ip=.+/m.test(partial) && /(?:^|\n)loc=.+/m.test(partial)) break;
		}
		if (!responseBuffer.length) throw new Error('ProxyIP未返回检测数据');
		const responseText = decoder.decode(responseBuffer);
		const statusLine = responseText.split('\r\n')[0] || '';
		const statusMatch = statusLine.match(/HTTP\/\d\.\d\s+(\d+)/);
		const statusCode = statusMatch ? Number(statusMatch[1]) : NaN;
		if (!Number.isFinite(statusCode) || statusCode < 200 || statusCode >= 300) throw new Error('ProxyIP检测请求失败: ' + (statusLine || '无效响应'));
		const ip = responseText.match(/(?:^|\n)ip=([^\r\n]+)/m)?.[1]?.trim();
		const loc = responseText.match(/(?:^|\n)loc=([^\r\n]+)/m)?.[1]?.trim() || '';
		const colo = responseText.match(/(?:^|\n)colo=([^\r\n]+)/m)?.[1]?.trim() || '';
		if (!ip) throw new Error('ProxyIP检测响应中未找到出口IP');
		return { success: true, proxyip: endpoint, ip, loc, colo, latency: Date.now() - startTime };
	} finally {
		try { tlsSocket?.close?.(); } catch (_) {}
		try { tcpSocket?.close?.(); } catch (_) {}
	}
}

"""
...'))"

      - name: Validate
        shell: bash
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq '>ProxyIP</button>' _worker.js
          grep -Fq 'id="btnVerifyProxyIp"' _worker.js
          grep -Fq "url.searchParams.has('proxyip')" _worker.js
          grep -Fq '请先完成并通过可用性验证' _worker.js
          if grep -Fq 'font-size:17px!important' _worker.js; then exit 1; fi
          if grep -Fq "btn.style.setProperty('height'" _worker.js; then exit 1; fi
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry

      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/fix-proxyip-verify-ui.yml
          git commit -m "feat: verify ProxyIP availability before adding node"
          git push origin HEAD:feature/force-proxyip
