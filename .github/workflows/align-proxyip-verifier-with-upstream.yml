name: Align ProxyIP verifier with upstream

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/align-proxyip-verifier-with-upstream.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0
      - name: Patch
        run: python3 .github/scripts/align_proxyip_verifier.py
      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq "https://api.090227.xyz/check?proxyip=" _worker.js
          ! grep -Fq "admin/proxyip-check-ws" _worker.js
          ! grep -Fq "检测ProxyIP可用性" _worker.js
          ! grep -Fq "官方TCP连接" _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry
      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: align ProxyIP verification with upstream checker'
          git rm .github/workflows/align-proxyip-verifier-with-upstream.yml .github/scripts/align_proxyip_verifier.py
          git commit -m 'chore: remove temporary ProxyIP verifier alignment helpers'
          git push origin feature/force-proxyip
