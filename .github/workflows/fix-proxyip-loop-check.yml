name: Fix ProxyIP loop check

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-loop-check.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Replace ProxyIP verification target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8-sig')
          old1 = "tlsSocket = new TlsClient(tcpSocket, { serverName: 'cloudflare.com', insecure: true });"
          new1 = "tlsSocket = new TlsClient(tcpSocket, { serverName: 'ifconfig.me', insecure: true });"
          if old1 not in s:
              raise SystemExit('ProxyIP TLS target anchor not found')
          s = s.replace(old1, new1, 1)
          old2 = "await withTimeout(tlsSocket.write(encoder.encode('GET /cdn-cgi/trace HTTP/1.1\\r\\nHost: cloudflare.com\\r\\nUser-Agent: Mozilla/5.0\\r\\nConnection: close\\r\\n\\r\\n')), 5000, 'ProxyIP检测请求写入超时');"
          new2 = "await withTimeout(tlsSocket.write(encoder.encode('GET /ip HTTP/1.1\\r\\nHost: ifconfig.me\\r\\nUser-Agent: Mozilla/5.0\\r\\nAccept: text/plain\\r\\nConnection: close\\r\\n\\r\\n')), 5000, 'ProxyIP检测请求写入超时');"
          if old2 not in s:
              raise SystemExit('ProxyIP request target anchor not found')
          s = s.replace(old2, new2, 1)
          old3 = "const ip = responseText.match(/(?:^|\\n)ip=([^\\r\\n]+)/m)?.[1]?.trim();\n\t\tconst loc = responseText.match(/(?:^|\\n)loc=([^\\r\\n]+)/m)?.[1]?.trim() || '';\n\t\tconst colo = responseText.match(/(?:^|\\n)colo=([^\\r\\n]+)/m)?.[1]?.trim() || '';"
          new3 = "const bodyText = responseText.slice(responseText.indexOf('\\r\\n\\r\\n') + 4).trim();\n\t\tconst ip = bodyText.match(/(?:\\d{1,3}\\.){3}\\d{1,3}/)?.[0] || bodyText.match(/[0-9a-fA-F]{0,4}:[0-9a-fA-F:]+/)?.[0] || '';\n\t\tconst loc = '';\n\t\tconst colo = '';"
          if old3 not in s:
              raise SystemExit('ProxyIP response parse anchor not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq "serverName: 'ifconfig.me'" _worker.js
          grep -Fq 'GET /ip HTTP/1.1' _worker.js
          grep -Fq '>PROXYIP</button>' _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry

      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: avoid Cloudflare TCP loop in ProxyIP verification'
          git rm .github/workflows/fix-proxyip-loop-check.yml
          git commit -m 'chore: remove temporary ProxyIP loop-check workflow'
          git push origin feature/force-proxyip
