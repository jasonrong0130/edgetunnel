name: Fix ProxyIP button final

on:
  push:
    branches: [feature/force-proxyip]
    paths: [.github/workflows/fix-proxyip-button-final.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0
      - name: Patch
        run: |
          python3 -c "p='_worker.js';s=open(p,encoding='utf-8-sig').read();s=s.replace('>ProxyIP节点</button>','>ProxyIP</button>').replace(\"btn.textContent = 'ProxyIP节点';\",\"btn.textContent = 'ProxyIP';\");open(p,'w',encoding='utf-8').write(s)"
          node --check _worker.js
          grep -Fq '>ProxyIP</button>' _worker.js
          grep -Fq "btn.textContent = 'ProxyIP';" _worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/fix-proxyip-button-final.yml
          git commit -m "fix: shorten ProxyIP button label"
          git push origin HEAD:feature/force-proxyip
