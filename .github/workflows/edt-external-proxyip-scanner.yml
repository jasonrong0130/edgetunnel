name: EDT external ProxyIP scanner integration
on:
  push:
    branches: [feature/force-proxyip]
    paths:
      - '.github/scripts/patch-edt-external-proxyip-scanner.py'
      - '.github/workflows/edt-external-proxyip-scanner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch EDT checker
        run: python .github/scripts/patch-edt-external-proxyip-scanner.py
      - name: Validate integration
        run: |
          node --input-type=module --check < _worker.js
          grep -F '/api/integrations/edt/check' _worker.js
          grep -F 'PROXYIP_SCANNER_URL' _worker.js
          grep -F 'PROXYIP_SCANNER_TOKEN' _worker.js
          ! grep -F '090227.xyz' _worker.js
          ! grep -F 'ProxyIPCheckerWorker' _worker.js
          test ! -e proxyip-checker-source.js
          test ! -e THIRD_PARTY_LICENSES/CF-Workers-CheckProxyIP-LICENSE
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js proxyip-checker-source.js THIRD_PARTY_LICENSES/CF-Workers-CheckProxyIP-LICENSE
          git commit -m 'feat: route ProxyIP verification through external scanner' || exit 0
          git push origin HEAD:feature/force-proxyip
