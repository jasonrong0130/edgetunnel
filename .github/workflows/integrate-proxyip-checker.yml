name: Integrate ProxyIP checker into EDT

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/integrate-proxyip-checker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Vendor checker source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=9e87c9de585289a045fe5afb7e9db0815f195a6d
          curl -fsSL "https://raw.githubusercontent.com/cmliu/CF-Workers-CheckProxyIP/${UPSTREAM_SHA}/_worker.js" -o proxyip-checker-source.js
          mkdir -p THIRD_PARTY_LICENSES
          curl -fsSL "https://raw.githubusercontent.com/cmliu/CF-Workers-CheckProxyIP/${UPSTREAM_SHA}/LICENSE" -o THIRD_PARTY_LICENSES/CF-Workers-CheckProxyIP-LICENSE
          python3 - <<'PY'
          from pathlib import Path
          p = Path('proxyip-checker-source.js')
          s = p.read_text(encoding='utf-8-sig')
          notice = "// Vendored from cmliu/CF-Workers-CheckProxyIP @ 9e87c9de585289a045fe5afb7e9db0815f195a6d\n// Integrated for EDT admin ProxyIP checking; see THIRD_PARTY_LICENSES/CF-Workers-CheckProxyIP-LICENSE.\n"
          if not s.startswith('// Vendored from cmliu/CF-Workers-CheckProxyIP'):
              s = notice + s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Integrate checker routes and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8-sig')

          imp = "import ProxyIPCheckerWorker from './proxyip-checker-source.js';\n"
          if imp not in s:
              s = imp + s

          helper_marker = 'async function 注入ProxyIP后台入口(response) {'
          helper = r'''const 内嵌ProxyIP检测器前缀 = '/admin/proxyip-checker';

async function 处理内嵌ProxyIP检测器(request, env) {
	const outerUrl = new URL(request.url);
	let suffix = outerUrl.pathname.slice(内嵌ProxyIP检测器前缀.length);
	if (!suffix) suffix = '/';
	else if (!suffix.startsWith('/')) suffix = '/' + suffix;

	const innerUrl = new URL(outerUrl.toString());
	innerUrl.pathname = suffix;
	const innerRequest = new Request(innerUrl.toString(), request);
	const response = await ProxyIPCheckerWorker.fetch(innerRequest, env);
	const contentType = String(response.headers.get('content-type') || '').toLowerCase();
	if (!contentType.includes('text/html')) return response;

	let html = await response.text();
	html = html
		.replaceAll("'/check?proxyip='", "'/admin/proxyip-checker/check?proxyip='")
		.replaceAll("'/resolve?proxyip='", "'/admin/proxyip-checker/resolve?proxyip='")
		.replaceAll("'/resolve-batch'", "'/admin/proxyip-checker/resolve-batch'")
		.replaceAll("'/locations'", "'/admin/proxyip-checker/locations'")
		.replace('const path = window.location.pathname.slice(1);', "const path = window.location.pathname.replace(/^\\/admin\\/proxyip-checker\\/?/, '');");

	const headers = new Headers(response.headers);
	headers.delete('content-length');
	headers.delete('content-encoding');
	headers.set('Cache-Control', 'no-store');
	return new Response(html, { status: response.status, statusText: response.statusText, headers });
}

'''
          if 'async function 处理内嵌ProxyIP检测器(request, env)' not in s:
              idx = s.find(helper_marker)
              if idx == -1:
                  raise SystemExit('admin injection helper marker not found')
              s = s[:idx] + helper + s[idx:]

          auth_anchor = "\t\t\t\t\tif (访问路径 === 'admin/log.json') {// 读取日志内容"
          if "访问路径 === 'admin/proxyip-checker'" not in s:
              if auth_anchor not in s:
                  raise SystemExit('authenticated admin route anchor not found')
              replacement = "\t\t\t\t\tif (访问路径 === 'admin/proxyip-checker' || 访问路径.startsWith('admin/proxyip-checker/')) {// 内嵌 ProxyIP 检测中心\n\t\t\t\t\t\treturn await 处理内嵌ProxyIP检测器(request, env);\n\t\t\t\t\t} else if (访问路径 === 'admin/log.json') {// 读取日志内容"
              s = s.replace(auth_anchor, replacement, 1)

          old_hint = '填写节点信息后可直接添加。添加后只会进入“自定义优选地址”，点击原页面“保存”后才正式生效。ProxyIP 可用性请在独立检测项目中确认。'
          new_hint = '填写节点信息后可直接添加。点击“可用性验证”会在新选项卡打开内置 ProxyIP 检测中心，并自动带入当前 ProxyIP；检测结果不影响添加。添加后点击原页面“保存”才正式生效。'
          if old_hint in s:
              s = s.replace(old_hint, new_hint, 1)

          buttons_old = '''\t\t<div class="api-buttons chain-proxy-buttons">\n\t\t\t<button type="button" class="btn btn-chain-add proxyip-add-btn" id="btnAddProxyIp" onclick="addProxyIpNode()">添加</button>\n\t\t\t<button type="button" class="btn btn-close-api" onclick="closeProxyIpModal()">取消</button>\n\t\t</div>'''
          buttons_new = '''\t\t<div class="api-buttons chain-proxy-buttons">\n\t\t\t<button type="button" class="btn btn-verify-api" id="btnVerifyProxyIp" onclick="openProxyIpChecker()">可用性验证</button>\n\t\t\t<button type="button" class="btn btn-chain-add proxyip-add-btn" id="btnAddProxyIp" onclick="addProxyIpNode()">添加</button>\n\t\t\t<button type="button" class="btn btn-close-api" onclick="closeProxyIpModal()">取消</button>\n\t\t</div>'''
          if 'id="btnVerifyProxyIp"' not in s:
              if buttons_old not in s:
                  raise SystemExit('ProxyIP modal button block not found')
              s = s.replace(buttons_old, buttons_new, 1)

          normalize_anchor = '''\tfunction normalizeProxy(value){\n\t\tconst v = String(value || '').trim();\n\t\tif (!v || v.includes('://') || /[\\s/#$]/.test(v)) throw new Error('ProxyIP 格式无效');\n\t\treturn v;\n\t}\n'''
          checker_fn = r'''	window.openProxyIpChecker = function(){
		try {
			const proxyip = normalizeProxy(document.getElementById('proxyIpAddress')?.value);
			const checkerUrl = '/admin/proxyip-checker/' + encodeURIComponent(proxyip);
			const tab = window.open('about:blank', '_blank');
			if (!tab) throw new Error('浏览器阻止了新选项卡，请允许本站打开新选项卡');
			try { tab.opener = null; } catch (_) {}
			tab.location.href = checkerUrl;
		} catch (error) {
			if (typeof showToast === 'function') showToast(error.message || String(error), 'error');
			else alert(error.message || String(error));
		}
	};
'''
          if 'window.openProxyIpChecker = function()' not in s:
              if normalize_anchor not in s:
                  raise SystemExit('normalizeProxy anchor not found')
              s = s.replace(normalize_anchor, normalize_anchor + checker_fn, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check _worker.js
          node --check proxyip-checker-source.js
          git diff --check
          grep -Fq "import ProxyIPCheckerWorker from './proxyip-checker-source.js';" _worker.js
          grep -Fq "访问路径 === 'admin/proxyip-checker'" _worker.js
          grep -Fq 'id="btnVerifyProxyIp"' _worker.js
          grep -Fq "window.open('about:blank', '_blank')" _worker.js
          grep -Fq "/admin/proxyip-checker/check?proxyip=" _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry

      - name: Commit and clean helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js proxyip-checker-source.js THIRD_PARTY_LICENSES/CF-Workers-CheckProxyIP-LICENSE
          git commit -m 'feat: integrate ProxyIP checker into EDT admin'
          git rm .github/workflows/integrate-proxyip-checker.yml
          git commit -m 'chore: remove temporary ProxyIP checker integration workflow'
          git push origin feature/force-proxyip
