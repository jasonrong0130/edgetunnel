name: One-shot ProxyIP injected browser script repair

on:
  push:
    paths:
      - '.github/workflows/fix-proxyip-injected-browser-script.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair injected browser script
        run: python3 scripts/fix_proxyip_injected_browser_script.py

      - name: Validate Worker and injected browser script
        run: |
          node --check _worker.js
          node --check /tmp/proxyip-injected-browser.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir /tmp/wrangler-dry
          git diff --check

      - name: Commit repair and cleanup one-shot files
        run: |
          rm -f .github/workflows/fix-proxyip-injected-browser-script.yml scripts/fix_proxyip_injected_browser_script.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js .github/workflows/fix-proxyip-injected-browser-script.yml scripts/fix_proxyip_injected_browser_script.py
          git commit -m 'fix: restore ProxyIP UI and protected rows'
          git push origin HEAD:main
