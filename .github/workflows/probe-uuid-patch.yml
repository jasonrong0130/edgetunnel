name: Restricted Probe UUID Patch

on:
  push:
    branches:
      - candidate/force-proxyip

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/force-proxyip
          fetch-depth: 0
      - name: Apply patch
        run: python3 .tmp_probe_uuid_patch.py
      - name: Validate worker syntax and restrictions
        run: |
          node --check _worker.js
          grep -F "env.EDT_PROBE_UUID" _worker.js
          grep -F "EDT probe UUID target is restricted" _worker.js
          grep -F "forceproxyip=[^?#\\s]+" _worker.js
      - name: Commit code and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .tmp_probe_uuid_patch.py .github/workflows/probe-uuid-patch.yml
          git add -A
          git commit -m "feat: add restricted EDT probe UUID" || exit 0
          git push origin HEAD:candidate/force-proxyip
