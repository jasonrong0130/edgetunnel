name: Fix ProxyIP button injection

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-button.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Apply repair
        run: python3 .github/scripts/fix_proxyip_button.py

      - name: Validate Worker bundle
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq "source.insertAdjacentElement('afterend', btn)" _worker.js
          grep -Fq "btn.textContent = 'ProxyIP节点'" _worker.js
          npx -y wrangler@4.129.0 deploy --dry-run --outdir /tmp/wrangler-dry

      - name: Commit repair and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/fix-proxyip-button.yml .github/scripts/fix_proxyip_button.py
          git commit -m "fix: restore ProxyIP admin button reliably"
          git push origin HEAD:feature/force-proxyip
