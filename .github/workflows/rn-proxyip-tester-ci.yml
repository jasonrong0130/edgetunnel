name: RN ProxyIP tester CI

on:
  push:
    branches:
      - feature/rn-proxyip-tester
    paths:
      - 'tools/rn-proxyip-tester/**'
      - '.github/workflows/rn-proxyip-tester-ci.yml'
  pull_request:
    paths:
      - 'tools/rn-proxyip-tester/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        working-directory: tools/rn-proxyip-tester
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax and import checks
        working-directory: tools/rn-proxyip-tester
        run: |
          python -m py_compile app.py
          python -c "import app; assert app.app.title == 'RN ProxyIP Tester'"
          bash -n install.sh
