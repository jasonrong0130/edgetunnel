name: Apply hidden ProxyIP admin mapping

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/apply-proxyip-admin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Normalize helper
        run: python3 .github/fix_proxyip_patch_helper.py

      - name: Apply patch
        run: python3 .github/apply_proxyip_admin.py

      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -q "proxyip-nodes.json" _worker.js
          grep -q "admin/proxyip-node" _worker.js
          grep -q "隐藏自定义ProxyIP" _worker.js

      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/apply_proxyip_admin.py .github/fix_proxyip_patch_helper.py .github/workflows/apply-proxyip-admin.yml
          git commit -m "feat: add hidden ProxyIP node manager"
          git push origin HEAD:feature/force-proxyip
