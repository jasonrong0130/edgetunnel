\t\t\t\t\t\t\t\t\t\tif (匹配到的反代IP) 完整节点路径 = (`${config_JSON.PATH}/proxyip=${匹配到的反代IP}`).replace(/\\/\\//g, '/') + (config_JSON.启用0RTT ? '?ed=2560' : '');
\t\t\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t\t}'''
          replace_once(proxy_block_old.encode('utf-8').decode('unicode_escape'), proxy_block_new.encode('utf-8').decode('unicode_escape'), 'prefer hidden ProxyIP mapping')

          path.write_text(text, encoding='utf-8')
          print('patched hidden ProxyIP admin mapping')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check _worker.js
          git diff --check
          grep -q "proxyip-nodes.json" _worker.js
          grep -q "admin/proxyip-node" _worker.js
          grep -q "隐藏自定义ProxyIP" _worker.js

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm .github/workflows/apply-proxyip-admin.yml
          git commit -m "feat: add hidden ProxyIP node manager"
          git push origin HEAD:feature/force-proxyip
