name: Refine ProxyIP admin UX

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/refine-proxyip-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/refine_proxyip_ui.py
      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -q 'id="proxyIpNodeModal"' _worker.js
          grep -q 'x-proxyip-nodes' _worker.js
          grep -q '请点击“保存”后生效' _worker.js
          ! grep -q "访问路径 === 'admin/proxyip' && request.method === 'GET'" _worker.js
          ! grep -q "访问路径 === 'admin/proxyip-node'" _worker.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/refine-proxyip-ui.yml .github/scripts/refine_proxyip_ui.py
          git commit -m "refactor: align ProxyIP admin UX with custom subscription flow"
          git push origin HEAD:feature/force-proxyip
