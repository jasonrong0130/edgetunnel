name: Fix ProxyIP WebSocket verification

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-ws-verify.yml
      - .github/scripts/patch_proxyip_ws_verify.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Patch ProxyIP verification transport
        run: python3 .github/scripts/patch_proxyip_ws_verify.py

      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq "访问路径 === 'admin/proxyip-check-ws'" _worker.js
          grep -Fq 'ProxyIP WebSocket验证超时' _worker.js
          grep -Fq 'async function 处理ProxyIP验证WS' _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry

      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: verify ProxyIP in WebSocket request context'
          git rm .github/workflows/fix-proxyip-ws-verify.yml .github/scripts/patch_proxyip_ws_verify.py
          git commit -m 'chore: remove temporary ProxyIP WebSocket verifier helpers'
          git push origin feature/force-proxyip
