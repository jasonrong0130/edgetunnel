name: Fix ProxyIP subscription append

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-subscription-append.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Patch subscription append behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_worker.js')
          text = p.read_text(encoding='utf-8-sig')
          needle = "\t\t\t\t\t\t\t\t其他节点LINK += 优选生成器其他节点;\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\tconst ECHLINK参数 ="
          replacement = "\t\t\t\t\t\t\t\t其他节点LINK += 优选生成器其他节点;\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t// 自定义 ProxyIP 节点应独立追加到订阅，不受随机优选/ADD/远程订阅生成模式影响。\n\t\t\t\t\t\t\tconst 隐藏ProxyIP节点列表 = Object.keys(自定义ProxyIP节点映射);\n\t\t\t\t\t\t\tif (隐藏ProxyIP节点列表.length) 完整优选IP = [...new Set(完整优选IP.concat(隐藏ProxyIP节点列表))];\n\t\t\t\t\t\t\tconst ECHLINK参数 ="
          if needle not in text:
              raise SystemExit('target snippet not found')
          text = text.replace(needle, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -q '隐藏ProxyIP节点列表' _worker.js
          grep -q '完整优选IP.concat(隐藏ProxyIP节点列表)' _worker.js

      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/fix-proxyip-subscription-append.yml
          git commit -m "fix: always append custom ProxyIP nodes to subscription"
          git push origin HEAD:feature/force-proxyip
