name: Apply force ProxyIP patch

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - '.github/workflows/apply-force-proxyip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_worker.js')
          text = p.read_text(encoding='utf-8-sig')
          lines = text.splitlines()

          def only_index(stripped, label):
              hits = [i for i, line in enumerate(lines) if line.strip() == stripped]
              if len(hits) != 1:
                  raise SystemExit(f'{label}: expected 1 exact line, got {len(hits)}')
              return hits[0]

          # 1) Accept $proxyip://... in a node remark.
          old_chain = r"const 链式代理匹配 = 节点备注.match(/\$(socks5|http|https|turn|sstp):\/\/([^#\s]+)/i);"
          i = only_index(old_chain, 'chain syntax')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i] = indent + r"const 链式代理匹配 = 节点备注.match(/\$(socks5|http|https|turn|sstp|proxyip):\/\/([^#\s]+)/i);"

          # 2) For proxyip, emit an explicit forceproxyip path instead of /video/<encoded proxy config>.
          chain_data = "const 链式代理数据 = { type: 代理协议, ...获取SOCKS5账号(代理参数, 获取代理默认端口(代理协议)) };"
          i = only_index(chain_data, 'chain node generation')
          if i + 1 >= len(lines) or not lines[i + 1].strip().startswith("完整节点路径 = `/video/${base64SecretEncode(JSON.stringify(链式代理数据), userID)"):
              raise SystemExit('chain node generation: expected /video line immediately after proxy data line')
          indent = lines[i][:-len(lines[i].lstrip())]
          original_video_line = lines[i + 1].strip()
          lines[i:i + 2] = [
              indent + "if (代理协议 === 'proxyip') {",
              indent + "\t完整节点路径 = (`${config_JSON.PATH}/forceproxyip=${代理参数}`).replace(/\\/\\//g, '/') + (config_JSON.启用0RTT ? '?ed=2560' : '');",
              indent + "} else {",
              indent + "\t" + chain_data,
              indent + "\t" + original_video_line,
              indent + "}",
          ]

          # 3) Add a force flag to the per-request reverse-proxy context.
          parser_state = "let 反代IP = 默认反代IP, 启用SOCKS5反代 = null, 启用SOCKS5全局反代 = false, 我的SOCKS5账号 = '', parsedSocks5Address = {}, 启用反代兜底 = 默认反代兜底;"
          i = only_index(parser_state, 'proxy parser state')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i] = indent + parser_state[:-1] + ", 强制ProxyIP = false;"

          context_line = "const 反代上下文 = { 木马反代地址: null, 反代IP, 代理类型: null, 代理账号: '', 代理全局: false, 代理参数: {}, 反代兜底: 启用反代兜底 };"
          i = only_index(context_line, 'proxy context')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i] = indent + "const 反代上下文 = { 木马反代地址: null, 反代IP, 代理类型: null, 代理账号: '', 代理全局: false, 代理参数: {}, 反代兜底: 启用反代兜底, 强制ProxyIP: false };"

          snapshot_line = "反代上下文.反代兜底 = 启用反代兜底;"
          i = only_index(snapshot_line, 'proxy snapshot')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines.insert(i + 1, indent + "反代上下文.强制ProxyIP = 强制ProxyIP;")

          # 4) Parse /forceproxyip=HOST:PORT before ordinary proxyip handling.
          query_line = "const 查询反代IP = searchParams.get('proxyip');"
          i = only_index(query_line, 'ordinary proxyip query')
          indent = lines[i][:-len(lines[i].lstrip())]
          force_parser = [
              indent + r"const 强制反代IP匹配 = /\/forceproxyip=([^?#\s]+)/i.exec(pathname);",
              indent + "if (强制反代IP匹配) {",
              indent + "\tconst 强制反代值 = 提取路径值(强制反代IP匹配[1]);",
              indent + "\tif (!强制反代值) throw new Error('强制 ProxyIP 地址为空');",
              indent + "\t设置反代IP(强制反代值);",
              indent + "\t强制ProxyIP = true;",
              indent + "\t保存快照();",
              indent + "\treturn 反代上下文;",
              indent + "}",
              "",
          ]
          lines[i:i] = force_parser

          # 5) Make forwardataTCP skip direct dialing when forced ProxyIP is selected.
          forward_state = "const ctx反代兜底 = 反代上下文.反代兜底 !== undefined ? 反代上下文.反代兜底 : true;"
          i = only_index(forward_state, 'forward proxy state')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines.insert(i + 1, indent + "const ctx强制ProxyIP = 反代上下文.强制ProxyIP === true;")

          log_prefix = "log(`[TCP转发] 目标: ${host}:${portNum} | 反代IP: ${ctx反代IP} | 反代兜底: ${ctx反代兜底 ? '是' : '否'} | 反代类型: ${ctx代理类型 || 'proxyip'} | 全局: ${ctx代理全局 ? '是' : '否'}`);"
          i = only_index(log_prefix, 'forward log')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i] = indent + "log(`[TCP转发] 目标: ${host}:${portNum} | 反代IP: ${ctx反代IP} | 反代兜底: ${ctx反代兜底 ? '是' : '否'} | 反代类型: ${ctx代理类型 || 'proxyip'} | 全局: ${ctx代理全局 ? '是' : '否'} | 强制ProxyIP: ${ctx强制ProxyIP ? '是' : '否'}`);"

          branch_prefix = "if (ctx代理类型 && (ctx代理全局 || SOCKS5白名单.some(p => new RegExp(`^${p.replace(/\\*/g, '.*')}$`, 'i').test(host)))) {"
          i = only_index(branch_prefix, 'global proxy branch')
          indent = lines[i][:-len(lines[i].lstrip())]
          lines[i:i + 1] = [
              indent + "if (ctx强制ProxyIP) {",
              indent + "\tlog(`[TCP转发] 启用强制 ProxyIP: ${ctx反代IP}`);",
              indent + "\ttry {",
              indent + "\t\tawait connecttoPry();",
              indent + "\t\tif (仅建立连接) return remoteConnWrapper.socket;",
              indent + "\t} catch (err) {",
              indent + "\t\tlog(`[TCP转发] 强制 ProxyIP 连接失败: ${err.message}`);",
              indent + "\t\tthrow err;",
              indent + "\t}",
              indent + "} else " + branch_prefix,
          ]

          # 6) Do not let the built-in local speed-test shortcut bypass a forced ProxyIP node.
          patched = '\n'.join(lines) + '\n'
          speed_guard = "isSpeedTestSite(hostname) && 反代上下文.代理类型 === null"
          count = patched.count(speed_guard)
          if count < 1:
              raise SystemExit('speed-test guards: none found')
          patched = patched.replace(speed_guard, speed_guard + " && !反代上下文.强制ProxyIP")
          print(f'patched {count} speed-test guard(s)')

          for marker in [
              "socks5|http|https|turn|sstp|proxyip",
              "forceproxyip=",
              "强制ProxyIP = true",
              "ctx强制ProxyIP",
              "启用强制 ProxyIP",
          ]:
              if marker not in patched:
                  raise SystemExit(f'missing marker after patch: {marker}')

          p.write_text(patched, encoding='utf-8-sig')
          PY

      - name: Syntax and diff checks
        run: |
          node --check _worker.js
          git diff --check
          git diff -- _worker.js

      - name: Commit tested patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm .github/workflows/apply-force-proxyip.yml
          git commit -m "feat: add per-node forced ProxyIP mode"
          git push origin HEAD:feature/force-proxyip
