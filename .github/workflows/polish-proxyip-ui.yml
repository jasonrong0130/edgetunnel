name: Polish ProxyIP admin UI

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/polish-proxyip-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Apply UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8-sig')
          old = 'placeholder="45.196.234.118:443"'
          if old not in s:
              raise SystemExit('ProxyIP placeholder anchor not found')
          s = s.replace(old, 'placeholder="1.1.1.1:443"', 1)
          pattern = r"function syncButton\(\)\{[\s\S]*?\n\t\}"
          replacement = "function syncButton(){\n\t\tconst source = document.getElementById('chainProxyBtn');\n\t\tconst btn = ensureButton();\n\t\tif (!source || !btn) return;\n\t\tbtn.classList.toggle('hidden-section', source.classList.contains('hidden-section'));\n\t\tbtn.style.display = source.style.display || '';\n\t\trequestAnimationFrame(function(){\n\t\t\tconst rect = source.getBoundingClientRect();\n\t\t\tif (rect.width > 0) btn.style.setProperty('width', rect.width + 'px', 'important');\n\t\t\tif (rect.height > 0) btn.style.setProperty('height', rect.height + 'px', 'important');\n\t\t});\n\t}"
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('syncButton anchor not found')
          anchor = "if (chainBtn) new MutationObserver(syncButton).observe(chainBtn, { attributes: true, attributeFilter: ['class','style'] });"
          if anchor not in s:
              raise SystemExit('observer anchor not found')
          s = s.replace(anchor, "if (chainBtn) { new MutationObserver(syncButton).observe(chainBtn, { attributes: true, attributeFilter: ['class','style'] }); if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncButton).observe(chainBtn); }", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq 'placeholder="1.1.1.1:443"' _worker.js
          grep -Fq "new ResizeObserver(syncButton).observe(chainBtn)" _worker.js
          grep -Fq "btn.style.setProperty('width', rect.width + 'px', 'important')" _worker.js

      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/polish-proxyip-ui.yml
          git commit -m "fix: align ProxyIP action size and anonymize example"
          git push origin HEAD:feature/force-proxyip
