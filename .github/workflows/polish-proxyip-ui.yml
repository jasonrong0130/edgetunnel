name: Polish ProxyIP admin UI

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/polish-proxyip-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Apply UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8-sig')

          old_placeholder = 'placeholder="45.196.234.118:443"'
          new_placeholder = 'placeholder="1.1.1.1:443"'
          if old_placeholder not in s:
              raise SystemExit('ProxyIP placeholder anchor not found')
          s = s.replace(old_placeholder, new_placeholder, 1)

          old_sync = """\tfunction syncButton(){
\t\tconst source = document.getElementById('chainProxyBtn');
\t\tconst btn = ensureButton();
\t\tif (!source || !btn) return;
\t\tbtn.classList.toggle('hidden-section', source.classList.contains('hidden-section'));
\t\tbtn.style.display = source.style.display || '';
\t\trequestAnimationFrame(function(){
\t\t\tconst w = source.getBoundingClientRect().width;
\t\t\tif (w > 0) btn.style.width = w + 'px';
\t\t});
\t}
"""
          new_sync = """\tfunction syncButton(){
\t\tconst source = document.getElementById('chainProxyBtn');
\t\tconst btn = ensureButton();
\t\tif (!source || !btn) return;
\t\tbtn.classList.toggle('hidden-section', source.classList.contains('hidden-section'));
\t\tbtn.style.display = source.style.display || '';
\t\trequestAnimationFrame(function(){
\t\t\tconst rect = source.getBoundingClientRect();
\t\t\tif (rect.width > 0) btn.style.setProperty('width', rect.width + 'px', 'important');
\t\t\tif (rect.height > 0) btn.style.setProperty('height', rect.height + 'px', 'important');
\t\t});
\t}
"""
          if old_sync not in s:
              raise SystemExit('syncButton anchor not found')
          s = s.replace(old_sync, new_sync, 1)

          old_observer = """\tif (chainBtn) new MutationObserver(syncButton).observe(chainBtn, { attributes: true, attributeFilter: ['class','style'] });
\tdocument.getElementById('ipMode')?.addEventListener('change', function(){ setTimeout(syncButton, 0); });
"""
          new_observer = """\tif (chainBtn) {
\t\tnew MutationObserver(syncButton).observe(chainBtn, { attributes: true, attributeFilter: ['class','style'] });
\t\tif (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncButton).observe(chainBtn);
\t}
\tdocument.getElementById('ipMode')?.addEventListener('change', function(){ setTimeout(syncButton, 0); });
"""
          if old_observer not in s:
              raise SystemExit('observer anchor not found')
          s = s.replace(old_observer, new_observer, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq 'placeholder="1.1.1.1:443"' _worker.js
          grep -Fq "new ResizeObserver(syncButton).observe(chainBtn)" _worker.js
          grep -Fq "btn.style.setProperty('width', rect.width + 'px', 'important')" _worker.js

      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/workflows/polish-proxyip-ui.yml
          git commit -m "fix: align ProxyIP action size and anonymize example"
          git push origin HEAD:feature/force-proxyip
