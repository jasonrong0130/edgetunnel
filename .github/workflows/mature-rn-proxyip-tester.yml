name: Mature RN ProxyIP tester

on:
  push:
    branches:
      - feature/rn-proxyip-tester
    paths:
      - .github/workflows/mature-rn-proxyip-tester.yml
      - .github/scripts/mature_rn_proxyip_tester.py

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rn-proxyip-tester
          fetch-depth: 0

      - name: Apply mature console upgrade
        run: python3 .github/scripts/mature_rn_proxyip_tester.py

      - name: Install dependencies
        run: |
          python3 -m pip install -r tools/rn-proxyip-tester/requirements.txt

      - name: Validate backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/rn-proxyip-tester/app.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tools/rn-proxyip-tester/app.py')
          spec = importlib.util.spec_from_file_location('rn_proxyip_tester', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          routes = {r.path for r in mod.app.routes}
          required = {'/', '/health', '/api/jobs', '/api/jobs/{job_id}', '/api/jobs/{job_id}/cancel', '/api/jobs/{job_id}/export.csv'}
          missing = required - routes
          assert not missing, missing
          print('routes ok')
          PY
          grep -Fq 'ProxyIP Scanner' tools/rn-proxyip-tester/static/index.html
          grep -Fq 'TOP 高速节点' tools/rn-proxyip-tester/static/index.html
          grep -Fq '停止任务' tools/rn-proxyip-tester/static/index.html
          grep -Fq '历史任务' tools/rn-proxyip-tester/static/index.html
          grep -Fq '理论最大测速流量' tools/rn-proxyip-tester/static/index.html
          grep -Fq 'speed.limit' tools/rn-proxyip-tester/README.md
          git diff --check

      - name: Commit upgrade and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rn-proxyip-tester/app.py tools/rn-proxyip-tester/static/index.html tools/rn-proxyip-tester/README.md
          git commit -m 'feat: mature RN ProxyIP scanner console'
          git rm .github/workflows/mature-rn-proxyip-tester.yml .github/scripts/mature_rn_proxyip_tester.py
          git commit -m 'chore: remove temporary RN scanner upgrade helpers'
          git push origin feature/rn-proxyip-tester
