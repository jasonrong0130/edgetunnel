name: One-shot ProxyIP popup editor migration

on:
  push:
    paths:
      - '.github/workflows/proxyip-popup-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ProxyIP popup editor patch
        run: python3 scripts/patch_proxyip_popup_editor.py

      - name: Validate Worker
        run: |
          node --check _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir /tmp/wrangler-dry
          git diff --check

      - name: Commit editor and remove one-shot files
        run: |
          rm -f .github/workflows/proxyip-popup-editor.yml scripts/patch_proxyip_popup_editor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js .github/workflows/proxyip-popup-editor.yml scripts/patch_proxyip_popup_editor.py
          git commit -m 'feat: edit ProxyIP nodes by stable id in popup'
          git push origin HEAD:main
# retry after patch-script anchor correction
