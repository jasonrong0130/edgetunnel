name: One-shot ProxyIP rename binding repair

on:
  push:
    paths:
      - '.github/workflows/proxyip-rename-binding-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve ProxyIP binding across row rename
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('_worker.js')
          s = path.read_text(encoding='utf-8')
          original = s

          old_anchor = "\t\t\t\t\t\t\t\tconst 旧节点映射 = await 读取自定义ProxyIP节点映射(env);\n\t\t\t\t\t\t\t\tconst 新节点映射 = {};"
          new_anchor = (
              "\t\t\t\t\t\t\t\tconst 旧节点映射 = await 读取自定义ProxyIP节点映射(env);\n"
              "\t\t\t\t\t\t\t\tconst 旧CustomIPs = await env.KV.get('ADD.txt') || '';\n"
              "\t\t\t\t\t\t\t\tconst 旧行列表 = 旧CustomIPs.split(/\\r?\\n/).map(规范化自定义优选行).filter(Boolean);\n"
              "\t\t\t\t\t\t\t\tconst 旧行集合 = new Set(旧行列表);\n"
              "\t\t\t\t\t\t\t\tconst 新节点映射 = {};"
          )
          if "const 旧CustomIPs = await env.KV.get('ADD.txt') || '';" not in s:
              if old_anchor not in s:
                  raise SystemExit('old ADD.txt mapping anchor not found')
              s = s.replace(old_anchor, new_anchor, 1)

          header_anchor = "\t\t\t\t\t\t\t\tconst 隐藏映射头 = request.headers.get('x-proxyip-nodes');"
          migration = (
              "\t\t\t\t\t\t\t\t// 同位置文本替换视为同一逻辑节点；纯重排不会触发迁移。\n"
              "\t\t\t\t\t\t\t\tif (旧行列表.length === 当前行列表.length) {\n"
              "\t\t\t\t\t\t\t\t\tfor (let i = 0; i < 旧行列表.length; i++) {\n"
              "\t\t\t\t\t\t\t\t\t\tconst 旧行 = 旧行列表[i], 新行 = 当前行列表[i];\n"
              "\t\t\t\t\t\t\t\t\t\tif (!旧行 || !新行 || 旧行 === 新行) continue;\n"
              "\t\t\t\t\t\t\t\t\t\t// 旧行仍存在或新行原本就存在，说明更像是移动/重排，不做猜测。\n"
              "\t\t\t\t\t\t\t\t\t\tif (当前行集合.has(旧行) || 旧行集合.has(新行)) continue;\n"
              "\t\t\t\t\t\t\t\t\t\tif (旧节点映射[旧行] && !新节点映射[新行]) 新节点映射[新行] = 规范化ProxyIP端点(旧节点映射[旧行]);\n"
              "\t\t\t\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\t\t\t}\n"
          )
          if '同位置文本替换视为同一逻辑节点' not in s:
              if header_anchor not in s:
                  raise SystemExit('hidden mapping header anchor not found')
              s = s.replace(header_anchor, migration + header_anchor, 1)

          if s == original:
              raise SystemExit('no changes produced')

          required = [
              "const 旧CustomIPs = await env.KV.get('ADD.txt') || '';",
              'const 旧行集合 = new Set(旧行列表);',
              '同位置文本替换视为同一逻辑节点',
              '当前行集合.has(旧行) || 旧行集合.has(新行)',
              '新节点映射[新行] = 规范化ProxyIP端点(旧节点映射[旧行])',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('post-patch assertions failed: ' + repr(missing))

          path.write_text(s, encoding='utf-8')
          PY

          node --check _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/proxyip-rename-binding-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js .github/workflows/proxyip-rename-binding-fix.yml
          git commit -m 'fix: keep ProxyIP binding when custom node name changes'
          git push origin HEAD:main
