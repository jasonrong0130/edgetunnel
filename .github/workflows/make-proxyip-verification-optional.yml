name: Make ProxyIP verification optional

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/make-proxyip-verification-optional.yml
      - .github/scripts/make_proxyip_verification_optional.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0

      - name: Patch
        run: python3 .github/scripts/make_proxyip_verification_optional.py

      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -Fq '可用性验证为可选项' _worker.js
          grep -Fq '仅作参考，不影响添加' _worker.js
          grep -Fq '检测服务判定该 ProxyIP 不可用' _worker.js
          ! grep -Fq '请先完成并通过可用性验证' _worker.js
          grep -Fq "if (addBtn) addBtn.disabled = !valid;" _worker.js
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir=/tmp/wrangler-dry

      - name: Commit and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: make ProxyIP verification optional'
          git rm .github/workflows/make-proxyip-verification-optional.yml .github/scripts/make_proxyip_verification_optional.py
          git commit -m 'chore: remove temporary ProxyIP optional verification helpers'
          git push origin feature/force-proxyip
