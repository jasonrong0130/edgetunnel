name: Fix ProxyIP admin entry

on:
  push:
    branches:
      - feature/force-proxyip
    paths:
      - .github/workflows/fix-proxyip-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/force-proxyip
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/fix_proxyip_entry.py
      - name: Validate
        run: |
          node --check _worker.js
          git diff --check
          grep -q 'proxyIpNodeBtn' _worker.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git rm -f .github/fix_proxyip_entry.py .github/workflows/fix-proxyip-entry.yml
          git commit -m "fix: render ProxyIP admin entry server-side"
          git push origin HEAD:feature/force-proxyip
