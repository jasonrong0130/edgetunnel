name: One-shot ProxyIP binding repair

on:
  push:
    paths:
      - '.github/workflows/proxyip-binding-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ProxyIP persistence and reorder handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('_worker.js')
          s = path.read_text(encoding='utf-8')
          original = s

          # 1) Canonical identity for a visible custom preferred-node line.
          marker = "const 内嵌ProxyIP检测器前缀 = '/admin/proxyip-checker';"
          helper = r'''function 规范化自定义优选行(value) {
          	const line = String(value || '').replace(/\r/g, '').trim();
          	if (!line) return '';
          	const hash = line.indexOf('#');
          	if (hash < 0) return line;
          	const address = line.slice(0, hash).trim();
          	const name = line.slice(hash + 1).trim();
          	return name ? `${address}#${name}` : address;
          }

          '''
          if 'function 规范化自定义优选行(value)' not in s:
              if marker not in s:
                  raise SystemExit('marker for canonical helper not found')
              s = s.replace(marker, helper + marker, 1)

          # 2) Old KV mappings are normalized on read, keeping backwards compatibility.
          old = "const key = line.trim(), value = proxyip.trim();"
          new = "const key = 规范化自定义优选行(line), value = proxyip.trim();"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('mapping read normalization target not found')

          # 3) Backend save becomes merge/reconcile instead of destructive client overwrite.
          backend_pattern = re.compile(
              r"const customIPs = await request\.text\(\);\n"
              r"\s*const 当前行集合 = new Set\(customIPs\.split\(/\\r\?\\n/\)\.map\(v => v\.trim\(\)\)\.filter\(Boolean\)\);\n"
              r"\s*let 新节点映射 = null;\n"
              r"\s*const 隐藏映射头 = request\.headers\.get\('x-proxyip-nodes'\);\n"
              r"\s*if \(隐藏映射头 !== null\) \{\n"
              r".*?"
              r"\s*\} else \{\n"
              r"\s*新节点映射 = await 读取自定义ProxyIP节点映射\(env\);\n"
              r"\s*for \(const line of Object\.keys\(新节点映射\)\) if \(!当前行集合\.has\(line\)\) delete 新节点映射\[line\];\n"
              r"\s*\}\n",
              re.S,
          )
          backend_repl = r'''const customIPs = await request.text();
          								const 当前行列表 = customIPs.split(/\r?\n/).map(规范化自定义优选行).filter(Boolean);
          								const 当前行集合 = new Set(当前行列表);
          								const 旧节点映射 = await 读取自定义ProxyIP节点映射(env);
          								const 新节点映射 = {};
          								// 先保留仍存在于文本框中的旧绑定。这样前端异步加载、重排、剪切/粘贴都不会误删 ProxyIP。
          								for (const [line, proxyip] of Object.entries(旧节点映射)) {
          									const key = 规范化自定义优选行(line);
          									if (key && 当前行集合.has(key)) 新节点映射[key] = 规范化ProxyIP端点(proxyip);
          								}
          								const 隐藏映射头 = request.headers.get('x-proxyip-nodes');
          								if (隐藏映射头 !== null) {
          									const parsed = JSON.parse(decodeURIComponent(隐藏映射头));
          									if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw new Error('ProxyIP 节点映射格式无效');
          									for (const [line, proxyip] of Object.entries(parsed)) {
          										const key = 规范化自定义优选行(line);
          										if (!key || !当前行集合.has(key)) continue;
          										新节点映射[key] = 规范化ProxyIP端点(proxyip);
          									}
          								}
          '''
          s2, n = backend_pattern.subn(backend_repl, s, count=1)
          if n == 1:
              s = s2
          elif 'const 旧节点映射 = await 读取自定义ProxyIP节点映射(env);' not in s:
              raise SystemExit('backend ADD.txt reconcile block not found')

          # 4) Frontend canonicalizes row identity and waits for persisted mappings before any save.
          old_front = "\tconst persisted = Object.create(null);\n\tconst pending = Object.create(null);\n\tconst nativeFetch = window.fetch.bind(window);\n\n\tfunction cleanLines(value){\n\t\treturn String(value || '').split(/\\r?\\n/).map(v => v.trim()).filter(Boolean);\n\t}"
          new_front = "\tconst persisted = Object.create(null);\n\tconst pending = Object.create(null);\n\tconst nativeFetch = window.fetch.bind(window);\n\tlet persistedReady = Promise.resolve();\n\n\tfunction canonicalLine(value){\n\t\tconst line = String(value || '').replace(/\\r/g, '').trim();\n\t\tif (!line) return '';\n\t\tconst hash = line.indexOf('#');\n\t\tif (hash < 0) return line;\n\t\tconst address = line.slice(0, hash).trim();\n\t\tconst name = line.slice(hash + 1).trim();\n\t\treturn name ? address + '#' + name : address;\n\t}\n\tfunction cleanLines(value){\n\t\treturn String(value || '').split(/\\r?\\n/).map(canonicalLine).filter(Boolean);\n\t}"
          if old_front in s:
              s = s.replace(old_front, new_front, 1)
          elif 'let persistedReady = Promise.resolve();' not in s:
              raise SystemExit('frontend cleanLines block not found')

          old_load = "persisted[String(item.line).trim()] = String(item.proxyip).trim();"
          new_load = "persisted[canonicalLine(item.line)] = String(item.proxyip).trim();"
          if old_load in s:
              s = s.replace(old_load, new_load, 1)
          elif new_load not in s:
              raise SystemExit('frontend persisted load target not found')

          save_anchor = "if (method === 'POST' && pathname === '/admin/ADD.txt') {\n\t\t\t\tconst textarea = document.getElementById('customIPs');"
          save_repl = "if (method === 'POST' && pathname === '/admin/ADD.txt') {\n\t\t\t\tawait persistedReady;\n\t\t\t\tconst textarea = document.getElementById('customIPs');"
          if save_anchor in s:
              s = s.replace(save_anchor, save_repl, 1)
          elif 'await persistedReady;' not in s:
              raise SystemExit('frontend save wait anchor not found')

          old_pending = "\t\t\tpending[line] = proxyip;"
          new_pending = "\t\t\tpending[canonicalLine(line)] = proxyip;"
          if old_pending in s:
              s = s.replace(old_pending, new_pending, 1)
          elif new_pending not in s:
              raise SystemExit('pending mapping target not found')

          old_ready = "\tloadPersisted();\n\tsyncButton();"
          new_ready = "\tpersistedReady = loadPersisted();\n\tsyncButton();"
          if old_ready in s:
              s = s.replace(old_ready, new_ready, 1)
          elif new_ready not in s:
              raise SystemExit('loadPersisted invocation target not found')

          # 5) Subscription lookup uses canonical identity, and canonical de-dupe avoids duplicate rows.
          old_dedupe = "const 隐藏ProxyIP节点列表 = Object.keys(自定义ProxyIP节点映射);\n\t\t\t\t\t\t\tif (隐藏ProxyIP节点列表.length) 完整优选IP = [...new Set(完整优选IP.concat(隐藏ProxyIP节点列表))];"
          new_dedupe = "const 隐藏ProxyIP节点列表 = Object.keys(自定义ProxyIP节点映射);\n\t\t\t\t\t\t\tif (隐藏ProxyIP节点列表.length) {\n\t\t\t\t\t\t\t\tconst 已有优选行 = new Set(完整优选IP.map(规范化自定义优选行).filter(Boolean));\n\t\t\t\t\t\t\t\tfor (const line of 隐藏ProxyIP节点列表) {\n\t\t\t\t\t\t\t\t\tconst key = 规范化自定义优选行(line);\n\t\t\t\t\t\t\t\t\tif (key && !已有优选行.has(key)) { 完整优选IP.push(line); 已有优选行.add(key); }\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t}"
          if old_dedupe in s:
              s = s.replace(old_dedupe, new_dedupe, 1)
          elif 'const 已有优选行 = new Set(' not in s:
              raise SystemExit('subscription dedupe target not found')

          old_lookup = "const 隐藏自定义ProxyIP = 自定义ProxyIP节点映射[String(原始地址).trim()] || '';"
          new_lookup = "const 隐藏自定义ProxyIP = 自定义ProxyIP节点映射[规范化自定义优选行(原始地址)] || '';"
          if old_lookup in s:
              s = s.replace(old_lookup, new_lookup, 1)
          elif new_lookup not in s:
              raise SystemExit('subscription ProxyIP lookup target not found')

          if s == original:
              raise SystemExit('no changes produced')

          required = [
              'function 规范化自定义优选行(value)',
              'const 旧节点映射 = await 读取自定义ProxyIP节点映射(env);',
              'await persistedReady;',
              'persistedReady = loadPersisted();',
              'pending[canonicalLine(line)] = proxyip;',
              '自定义ProxyIP节点映射[规范化自定义优选行(原始地址)]',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('post-patch assertions failed: ' + repr(missing))

          path.write_text(s, encoding='utf-8')
          PY

          node --check _worker.js
          git diff --check

      - name: Commit repaired worker and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/proxyip-binding-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js .github/workflows/proxyip-binding-fix.yml
          git commit -m 'fix: preserve ProxyIP bindings across saves and reorder'
          git push origin HEAD:main
